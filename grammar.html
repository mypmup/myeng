const RULES=[
"У каждого английского предложения есть глагол. Где по-русски его нет («Он врач», «Мы дома»), ставим am / is / are (быть, являться): He is a doctor (он врач), We are at home (мы дома). Где нет и подлежащего («Холодно», «Поздно»), ставим пустое It (оно): It's cold (холодно), It's late (поздно).",
"Обычный глагол работает сам: I work (я работаю), she works (она работает). am / is / are рядом с ним не нужен. Для вопроса и отрицания зовём помощника do / does (без перевода, просто «рабочая» частица), и -s переходит к нему: Does she work? (она работает?) She doesn't work (она не работает).",
"Порядок жёсткий: кто → что делает → что → где → когда. Вопрос делаем перестановкой: помощник (do, is, can — могу, will — буду) встаёт перед подлежащим: Can you help? (можешь помочь?). Одной интонацией вопрос не задаём.",
"«У меня есть» по-английски звучит как «я имею»: I have / I've got (у меня есть). «Где-то есть что-то» — There is / There are (есть, имеется), а место уходит в конец: There is a café here (здесь есть кафе). В выражениях have a shower (принимать душ), have lunch (обедать) глагол have — это действие.",
"Подлежащее — I (я), he (он), she (она), we (мы), they (они); после глагола и предлога — me (меня/мне), him (его/ему), her (её/ей), us (нас/нам), them (их/им). «Мне нравится», «мне нужно» переворачиваем: I like (мне нравится), I need (мне нужно). «Свой» переводим по владельцу: my (мой), his (его), her (её), their (их). this / these (этот / эти) — близко, that / those (тот / те) — далеко. Без существительного: mine (мой), hers (её), ours (наш).",
"Русское настоящее время одно, английских два. Привычка, факт, расписание — present simple: I work (я работаю вообще). Прямо сейчас или временно — am / is / are + -ing: I'm working (я сейчас работаю). Глаголы знания и чувства — know (знать), like (нравиться), want (хотеть), need (нуждаться) — обычно в -ing не ставим.",
"Одни существительные считаются: an apple (яблоко), two apples (два яблока). Другие нет: bread (хлеб), money (деньги), information (информация), advice (совет), news (новости), furniture (мебель), luggage (багаж). У неисчисляемых нет a и множественного числа, глагол — в единственном: The money is here (деньги здесь).",
"Русскому артикль не нужен, английскому — почти всегда. a / an («один, какой-то», упомянут впервые): a dress (какое-то платье). the («тот самый, понятно какой, единственный»): the dress (то самое платье), the sun (солнце). С профессией — a: She's a doctor (она врач). Без артикля — обобщение во множественном и неисчисляемые: I like cats (я люблю кошек вообще).",
"«Много»: many — для исчисляемых (many eggs — много яиц), much — для неисчисляемых (much time — много времени, чаще в вопросах и отрицаниях), a lot of — для всего. «Немного, несколько»: a few — исчисляемые (a few friends — несколько друзей), a little — неисчисляемые (a little milk — немного молока). some (немного, какие-то) — в утверждении, any (какой-нибудь, никакой) — в вопросе и отрицании. too many / too much — слишком много, all — все.",
"Отрицание в английском одно на фразу: Nobody came (никто не пришёл), I don't know anything (я ничего не знаю). nobody / nothing — никто / ничего; anybody / anything — кто-нибудь / что-нибудь (с not = никто / ничего); somebody / somewhere — кто-то / где-то. «Себя, сам» — myself (себя/сам), yourself (себя/сам — ты), herself (сама). «Друг друга» — each other. Чтобы не повторять слово: the red one (красный), the black ones (чёрные).",
"Русские «в» и «на» распадаются на три: in (в, внутри): in the box (в коробке), in Moscow (в Москве); on (на поверхности): on the table (на столе), on the wall (на стене); at (у, в точке, на мероприятии): at the station (на вокзале), at work (на работе), at a party (на вечеринке). Движение: into (в, внутрь — войти в), across (через, поперёк — с одной стороны на другую), along (вдоль, по), past (мимо), over (над, через — поверх).",
"at — время по часам: at 7 (в семь), at night (ночью). on — дни и даты: on Monday (в понедельник), on 5 May (5 мая). in — месяцы, годы, части дня: in June (в июне), in 2020 (в 2020 году), in the morning (утром). «Через час» — in an hour. «В течение»: for (на протяжении, сколько длится) — for three years (три года), during (во время чего) — during the film (во время фильма).",
"Многие глаголы держат свой предлог, и он не совпадает с русским: depend on (зависеть от), listen to (слушать), wait for (ждать), look at (смотреть на), agree with (соглашаться с), think about (думать о), arrive in / at (прибыть в). Устойчивые фразы учим целиком: at home (дома), in bed (в постели), on holiday (в отпуске), by bus (на автобусе). В вопросе предлог уходит в конец: Who are you waiting for? (кого ты ждёшь?)",
"«Был» — was / were (был / были). Действие в прошлом — глагол + -ed (worked — работал) или вторая форма неправильного глагола: go → went (пошёл), see → saw (увидел), buy → bought (купил). В вопросе и отрицании помощник did забирает прошлое на себя, глагол возвращается в начальную форму: Did you go? (ты ходил?) I didn't see (я не видел).",
"Был в процессе — was / were + -ing: I was cooking (я готовила, была в процессе). Короткое событие, которое его прервало, — past simple: I was cooking when you called (я готовила, когда ты позвонил). Привычка в прошлом, которой больше нет, — used to (раньше, бывало): I used to smoke (раньше я курил). Отрицание: didn't use to (раньше не…).",
"Русское прошедшее одно, английских два. Важен результат сейчас или опыт за жизнь без даты — have / has + третья форма: He's broken his leg (он сломал ногу — и она сейчас сломана), I've been to Paris (я была в Париже — такой опыт). Слова just (только что), already (уже), yet (ещё / уже — в вопросах и отрицаниях), ever (когда-нибудь), never (никогда) обычно живут в perfect.",
"Ситуация началась в прошлом и длится сейчас: по-русски говорим в настоящем («живу пять лет»), по-английски — perfect: I've lived here for five years (я живу здесь пять лет). for (в течение) — сколько: for two years (два года); since (с, начиная с) — с какого момента: since April (с апреля). Есть точное «когда» — yesterday (вчера), last year (в прошлом году), in 2019 — ставим past simple.",
"Действие идёт до сих пор (или только что закончилось), и важна длительность — have been + -ing: I've been waiting for an hour (я жду уже час). Важен результат или количество — обычный perfect: I've read three books (я прочитала три книги). How long (как долго, сколько уже) часто требует have been + -ing.",
"Прилагательное стоит перед существительным и не меняется: a long blue skirt (длинная синяя юбка), long skirts (длинные юбки). Сначала размер, потом цвет: big brown eyes (большие карие глаза). -ed — что чувствует человек: bored (скучающий — «мне скучно»), tired (уставший), interested (заинтересованный). -ing — какой предмет или ситуация: boring (скучный), tiring (утомительный), interesting (интересный), amazing (удивительный).",
"Как делает — после глагола и объекта: He speaks English well (он хорошо говорит по-английски), She drives fast (она быстро водит). Как часто — always (всегда), usually (обычно), often (часто), rarely (редко), never (никогда) — перед обычным глаголом, но после be: She always reads (она всегда читает), She's always late (она всегда опаздывает). «Очень» перед глаголом не ставим: I really like it (мне очень нравится) или I like it very much.",
"Короткие слова — -er / -est: old → older (старше) → the oldest (самый старый). Длинные — more / the most: more expensive (дороже), the most expensive (самый дорогой). Неправильные: good → better (лучше) → the best (лучший). Не удваиваем: better, а не more better. «Чем» — than. not as … as — «не такой … как». too (слишком) — перед словом: too hot (слишком жарко); enough (достаточно) — после прилагательного: big enough (достаточно большой).",
"Решил заранее, есть план — be going to (собираюсь): I'm going to call her (я собираюсь ей позвонить). Решил прямо сейчас, обещаешь, предсказываешь — will (буду / сделаю): I'll call you later (я позвоню тебе позже). won't = will not (не буду). По-русски одно «позвоню», по-английски выбираем по моменту решения.",
"Договорился, есть время и место — present continuous: I'm meeting Anna on Friday (я встречаюсь с Анной в пятницу). Расписание (поезд, сеанс, урок) — present simple: The train leaves at 6 (поезд отправляется в 6). План — going to, решение прямо сейчас — will.",
"После if (если), when (когда), before (перед тем как), after (после того как), until (пока не), as soon as (как только) будущее не ставим — там настоящее: If it rains, we'll stay home (если пойдёт дождь, мы останемся дома). When I come, I'll call (когда приду, позвоню). Будущее показываем один раз — в главной части. Если результат всегда одинаковый, настоящее в обеих частях: If you press this, it opens (если нажать это, оно открывается).",
"Нереальное или маловероятное «если бы» — if + прошедшая форма, а в главной части would (бы) + глагол: If I was rich, I'd travel (если бы я была богата, я бы путешествовала). Прошедшая форма здесь не про прошлое, а про «не по-настоящему». would после if не ставим. Совет «на твоём месте я бы…» — If I were you, I'd…",
"can (могу, умею, можно): I can swim (я умею плавать), Can I come in? (можно войти?). could (мог, умел в прошлом; или вежливое «не могли бы»): Could you help me? (не могли бы вы помочь?). В будущем — will be able to (смогу). can't (не могу, нельзя), couldn't (не смог). После этих слов глагол без to и без -s: She can drive (она умеет водить).",
"«Надо, приходится» — have to (правила, обстоятельства): I have to go (мне надо идти); must (должен — сам считаю нужным). mustn't (нельзя!) и don't have to (не обязательно) — разные вещи. need to (нужно). Прошлое — had to (пришлось), будущее — will have to (придётся).",
"Совет — should (стоит, следует): You should rest (тебе стоит отдохнуть); shouldn't (не стоит). Возможно — might / may (может быть): It might rain (может пойти дождь). Уверен, что да, — must be (должно быть): You must be tired (ты, должно быть, устал). Уверен, что нет, — can't be (не может быть): It can't be true (это не может быть правдой).",
"После одних глаголов — -ing: enjoy (наслаждаться, любить делать), like (нравиться), love (обожать), finish (заканчивать), mind (возражать), stop (прекращать): I enjoy cooking (я люблю готовить). После других — to: want (хотеть), decide (решать), hope (надеяться), promise (обещать), would like (хотел бы): I want to go (я хочу пойти). После предлога — всегда -ing: I'm good at drawing (я хорошо рисую).",
"«Хочу, чтобы ты…» — want + кто + to: I want you to stay (я хочу, чтобы ты остался). let (разрешать) + кто + глагол без to: let me go (отпусти меня). make (заставлять) + кто + глагол без to: He made me laugh (он меня рассмешил). ask / advise (просить / советовать) + кто + to. Два дополнения: send her flowers = send flowers to her (отправить ей цветы). explain (объяснять) и say (говорить) — только с to перед человеком: Explain it to me (объясни мне это); tell (сказать кому-то) — без to: Tell me (скажи мне).",
"Спрашиваем о подлежащем (кто сделал?) — помощник не нужен: Who called you? (кто тебе звонил?). Спрашиваем о дополнении (кого? что?) — нужен: Who did you call? (кому ты звонил?). which (который, какой из) — выбор из известного, what (что, какой) — вообще. whose (чей). how long (как долго) / how old (сколько лет) / how far (как далеко) — «насколько».",
"and (и), but (но), or (или), because (потому что), so (поэтому), so that (чтобы). because of (из-за) — только перед существительным. В рассказе — first (сначала), then (потом), after that (после этого), finally (наконец). because и so в одной фразе вместе не ставим.",
"«Который»: who — для людей, which — для вещей, that — для обоих. where (где) — для места. Если «который» — дополнение, его можно опустить: the film (that) I saw (фильм, который я посмотрела). Предлог уходит в конец: the beach (that) we went to (пляж, на который мы ходили).",
"В пересказе время сдвигается назад: «Я голодна» → She said she was hungry (она сказала, что голодна). say (сказать) — без «кому», tell (сказать кому-то) — с человеком: She told me (она сказала мне). ask (спросить) + if (ли) для вопросов «да/нет». Вопрос внутри фразы теряет вопросительный порядок: Do you know where he lives? (ты знаешь, где он живёт?)",
"Неважно, кто сделал, или это очевидно, — be + третья форма (пассив): English is spoken here (здесь говорят по-английски), The bridge was built in 1900 (мост построили в 1900 году). Русские «здесь говорят», «мне сказали» (I was told) часто переводятся пассивом. Сделали для меня по заказу — have something done: I had my hair cut (я подстриглась — в парикмахерской).",
"Слова живут парами, которые не переводятся дословно: heavy rain (сильный дождь), make a mistake (сделать ошибку), make a decision (принять решение), do homework (делать домашку), do a favour (сделать одолжение), take a photo (сфотографировать). bring (принести сюда) и take (отнести туда). Фразовые глаголы: take off (снимать), turn on (включать), look after (присматривать). Объект может стоять внутри (take your shoes off), а местоимение — только внутри (take them off).",
"Из одного корня строим слова суффиксами: teach (учить) → teacher (учитель), move (двигать) → movement (движение), care (забота) → careful (осторожный), use (польза) → useful (полезный), centre (центр) → central (центральный). Существительные склеиваются, и первое работает как прилагательное, в единственном числе: a clothes shop (магазин одежды), a ten-minute walk (десятиминутная прогулка).",
"Короткие ответы строим тем же помощником: «я тоже» — So do I / So am I; «я тоже нет» — Neither do I / Neither am I. Хвостик-переспрос («да? правда?»): It's cold, isn't it? (холодно, правда?). Реакции: How awful! (какой ужас!), That's wonderful! (это чудесно!), Really? (правда?).",
"Когда действие работает как существительное, берём -ing: Swimming is good for you (плавание полезно). После предлога глагол всегда с -ing: before leaving (перед уходом), thanks for helping (спасибо, что помог), interested in learning (интересуется изучением), without saying (не сказав). Устойчивые: go shopping (ходить по магазинам), look forward to seeing (с нетерпением ждать встречи), be used to working (привыкнуть работать), How about going…? (как насчёт того, чтобы пойти…?).",

const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const TT={choice:"Выбери верный вариант",gap:"Вставь пропущенное",match:"Соедини пары",build:"Собери фразу",error:"Найди ошибку",type:"Напиши по-английски"};
const LV={choice:1,gap:2,match:2,build:3,error:4,type:5};

function items(t){const p=PATH[t];return [...p.nw,...p.mx,...EX[t]].map(a=>{const b=a[1][0]==="=";return{ru:a[0],right:b?a[1].slice(1):a[1],wrong:b?[]:a.slice(2)}})}
function diff(R,W){const r=R.split(" "),w=W.split(" ");let p=0;while(p<r.length&&p<w.length&&r[p]===w[p])p++;let s=0;while(s<r.length-p&&s<w.length-p&&r[r.length-1-s]===w[w.length-1-s])s++;
  return{r,w,p,s,mr:r.slice(p,r.length-s),mw:w.slice(p,w.length-s)}}
const BANK=PATH.map((_,t)=>{
  const out={choice:[],gap:[],build:[],error:[],type:[],match:[]};
  const its=items(t);
  its.forEach(it=>{
    if(it.wrong.length) out.choice.push({ty:"choice",t,full:it.right,ru:it.ru,opts:[it.right,...it.wrong],ans:it.right});
    const n=it.right.split(" ").length;
    if(n>=2&&n<=11) out.build.push({ty:"build",t,full:it.right,ru:it.ru,ans:it.right});
    if(n<=9) out.type.push({ty:"type",t,full:it.right,ru:it.ru,ans:it.right});
    const gaps=[];let gb=null;
    it.wrong.forEach(W=>{const d=diff(it.right,W);
      if(d.mr.length>=1&&d.mr.length<=3&&d.mw.length>=1&&d.mw.length<=3&&d.p+d.s>=1){
        if(!gb)gb={before:d.r.slice(0,d.p).join(" "),after:d.r.slice(d.r.length-d.s).join(" "),ans:d.mr.join(" ")};
        if(gb.before===d.r.slice(0,d.p).join(" ")&&gb.after===d.r.slice(d.r.length-d.s).join(" "))gaps.push(d.mw.join(" "))}
      if(d.mw.length>=1&&d.mw.length<=2&&d.mr.length>=1&&d.p+d.s>=1&&!out.error.some(e=>e.ru===it.ru))
        out.error.push({ty:"error",t,full:it.right,ru:it.ru,words:d.w,bad:d.mw.map((_,k)=>d.p+k),ans:it.right})});
    if(gb&&gaps.length) out.gap.push({ty:"gap",t,full:it.right,ru:it.ru,before:gb.before,after:gb.after,opts:[gb.ans,...new Set(gaps)].filter((v,i,a)=>a.indexOf(v)===i),ans:gb.ans});
  });
  const short=shuf(its.slice().sort((a,b)=>a.right.length-b.right.length).slice(0,Math.max(4,its.filter(i=>i.right.split(" ").length<=6).length)));
  for(let k=0;k+4<=short.length&&k<8;k+=4) out.match.push({ty:"match",t,pairs:short.slice(k,k+4).map(i=>[i.ru,i.right])});
  return out});

const LESSONS=[];LEVELS.forEach((l,li)=>{l.t.forEach(t=>LESSONS.push({kind:"topic",t,lv:li}));LESSONS.push({kind:"check",lv:li})});
const lpass=i=>st.les[i]&&st.les[i].pass;
const lopen=i=>st.open||i===0||lpass(i-1);
const learned=()=>{const s=new Set();LESSONS.forEach((l,i)=>{if(l.kind==="topic"&&(lpass(i)||st.open))s.add(l.t)});return[...s]};
function stat(t){return st.tp[t]||(st.tp[t]={ok:0,bad:0,last:0})}
function weight(t){const s=stat(t),days=(Date.now()-(s.last||0))/864e5;return 1+4*s.bad/(s.ok+s.bad+1)+Math.min(3,days*.5)}
function pickTopics(pool,n){const out=[];const w=pool.map(t=>[t,weight(t)]);for(let i=0;i<n&&w.length;i++){let tot=w.reduce((a,b)=>a+b[1],0),r=Math.random()*tot,k=0;while(r>w[k][1]){r-=w[k][1];k++}out.push(w[k][0]);if(pool.length>n)w.splice(k,1)}return out}
function take(t,ty,used){const b=BANK[t];let order=[ty,...{choice:["gap","build"],gap:["choice","build"],match:["gap","choice"],build:["gap","type"],error:["build","type"],type:["build","error"]}[ty]];
  for(const y of order){const c=shuf(b[y].filter(x=>!used.has(x)));if(c.length){used.add(c[0]);return c[0]}}return null}

/* ===== сборка уроков ===== */
function buildTopic(i){const L=LESSONS[i],t=L.t,used=new Set(),q=[];
  ["choice","choice","gap","gap","match","build","build","error","error","type","type"].forEach(y=>{const x=take(t,y,used);if(x)q.push(Object.assign({},x,{tag:"Новая тема"}))});
  const prev=[];for(let j=0;j<i;j++)if(LESSONS[j].kind==="topic")prev.push(LESSONS[j].t);
  if(prev.length){const tys=L.lv<1?["choice","gap","build","build"]:L.lv<3?["gap","build","error","type"]:["build","error","type","type"];
    const tops=pickTopics(prev,4);mixOrder(tops.map((tt,k)=>take(tt,tys[k%tys.length],used)).filter(Boolean).map(x=>Object.assign({},x,{tag:"Микс",cls:"mx"}))).forEach(x=>q.push(x))}
  return q}
function buildMix(pool,n,label){const used=new Set(),tops=pickTopics(pool,n),plan=["choice","choice","gap","gap","match","build","build","build","error","error","error","type","type","type","type"];
  const q=tops.map((t,k)=>take(t,plan[Math.floor(k*plan.length/n)],used)).filter(Boolean).map(x=>Object.assign({},x,{tag:label,cls:"mx"}));
  return mixOrder(q)}
function mixOrder(q){q.sort((a,b)=>LV[a.ty]-LV[b.ty]);for(let k=1;k<q.length;k++)if(q[k].t===q[k-1].t){const j=q.findIndex((x,m)=>m>k&&x.t!==q[k].t&&LV[x.ty]===LV[q[k].ty]);if(j>0)[q[k],q[j]]=[q[j],q[k]]}return q}

const AI_ENDPOINT="";
let AI=null;
function endpointAI(url){const call=async(prompt,json)=>{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json})});
    if(r.status===429)throw{code:"rate_limited"};if(!r.ok)throw{code:"error"};return (await r.json()).text||""};
  const f=async(p,o)=>{const text=await call(p,false);if(o&&o.onText)o.onText({text});return{text}};
  f.json=async p=>{const t=await call(p,true);return JSON.parse(t.replace(/^```json|```$/g,"").trim())};return f}
if(AI_ENDPOINT)AI=endpointAI(AI_ENDPOINT);

function aiPrompt(t,student){const p=PATH[t.t];return `You check a translation exercise for a Russian-speaking learner of English (level A2-B1).
Grammar topic being practised: ${p.n}. Rule: ${p.r}
Russian sentence: "${t.ru}"
Reference answer: "${t.ans}"
Student answer: "${student}"

Decide whether the student's answer is a correct, natural English translation of the Russian sentence.
ACCEPT: synonyms and other natural wording, other correct word order, contractions or full forms, British or American usage, numbers as digits, missing final punctuation, wrong capitalisation, and small spelling typos in words that do not carry the grammar point (set typo=true).
REJECT: any grammar mistake, especially one on the practised topic (verb form, tense, article, preposition, word order, auxiliary); Russian-style calques; a changed meaning; an answer in Russian.
A typo that changes a grammar form (e.g. work/works, a/the, in/on) is a grammar mistake, not a typo.

Reply with JSON only, no other text:
{"ok": true or false, "typo": true or false, "fixed": "the student's answer with the minimum corrections needed (same as student answer if nothing to fix)", "comment": "one or two short sentences in Russian for the learner: if ok, say briefly whether their variant differs from the reference and that it is fine; if not ok, name the exact mistake and the rule behind it. Address the learner informally (на ты)."}`}
async function aiCheck(t,student){const r=await AI.json(aiPrompt(t,student),{modelTier:"quick"});
  if(!r||typeof r.ok!=="boolean")throw new Error("bad");return r}
async function aiExplain(t,el){const p=PATH[t.t];el.textContent="Думаю…";
  try{await AI(`A Russian-speaking learner of English (A2-B1) made a mistake in a grammar exercise.
Topic: ${p.n}. Rule: ${p.r}
Task type: ${TT[t.ty]}. Russian sentence: "${t.ru||""}". Correct answer: "${t.ans}". Learner's answer: "${run.given||""}".
In Russian, informally (на ты), in 2-3 short sentences: say exactly what is wrong in the learner's answer, why (link it to the rule or to the Russian habit behind the mistake), and give one more short example sentence with the correct pattern (English + Russian translation). No greetings, no markdown.`,
   {modelTier:"quick",onText:({text})=>{el.textContent=text}})}catch(e){el.textContent=e&&e.code==="rate_limited"?"Слишком много запросов, попробуй чуть позже.":"Не получилось получить разбор."}}

function diagIntro(){app.innerHTML=`<div class="card"><div class="scheme">Диагностика · 5 минут</div><p class="ru" style="font-size:22px">По одной фразе из каждой из ${PATH.length} тем</p>
  <p style="color:var(--mut)">В конце увидите, какие темы уже в порядке, а какие стоит пройти. Темы без ошибок можно отметить как пройденные.</p><button class="btn" id="go">Начать</button></div>`;
  go.onclick=()=>{const used=new Set();run={i:0,ok:0,diag:true,q:shuf(PATH.map((_,t)=>take(t,"choice",used))).map(x=>Object.assign({},x,{tag:"Диагностика"})),lesson:null,miss:[]};run.first=run.q.length;render()}}

function head(t){const n=run.q.length;return `<div class="card"><div class="toprow"><button class="back" id="bk">← Выйти</button><button class="help" id="hp" title="Правило">?</button></div>
  <div class="bar"><i style="width:${run.i/n*100}%"></i></div><div class="meta"><span>${run.i+1} из ${n}</span><span>верно ${run.ok}</span></div>
  <span class="tag ${t.cls||""}">${esc(t.tag)}${t.retry?" · ещё раз":""}</span> <span class="tag">${TT[t.ty]}</span>
  <div class="topic">${esc(PATH[t.t].n)}</div>`}
function feedback(t){if(run.checking)return `<div class="why"><b>Проверяю ответ…</b><br><span style="color:var(--mut)">ИИ смотрит, не подходит ли твой вариант тоже.</span></div>`;
  if(run.res==null)return"";const a=run.ai;let body="";
  if(a){body=run.res?`${a.typo?`<br>Засчитано, но есть опечатка: <b>${esc(a.fixed)}</b>`:""}${norm(run.given)!==norm(t.ans)?`<br>Вариант из урока: <b>${esc(t.ans)}</b>`:""}<br>${esc(a.comment||"")}`
                    :`<br>Исправлено: <b>${esc(a.fixed)}</b><br>${esc(a.comment||"")}<br><span style="color:var(--mut)">Вариант из урока: ${esc(t.ans)}</span>`}
  else{const why=t.ty==="match"?"":(EXPL[t.full]||"");
    body=(run.res||t.ty==="match"?"":`<br>Правильно: <b>${esc(t.full||t.ans)}</b>`)+(why?`<div class="expl">Почему: ${esc(why)}</div>`:"")}
  const ex=!run.res&&AI&&!a&&t.ty!=="match"?`<button class="linkb" id="aix">Разобрать мою ошибку (ИИ)</button><div class="aiout" id="aio"></div>`:"";
  return `<div class="why ${run.res?"ok":"no"}"><b>${run.res?"Верно!":"Не совсем."}</b>${body}${a?`<div class="aibadge">проверено ИИ</div>`:""}
  ${run.res?"":`<br><button class="linkb" id="why">Открыть правило</button> ${ex}`}</div><button class="btn" id="nx">Дальше →</button>`}

function task(){const t=run.q[run.i];let h=head(t),done=run.res!=null;
  if(t.ty!=="match")h+=`<p class="ru" style="margin-top:6px">${esc(t.ru)}</p>`;
  if(t.ty==="choice"){if(!t._o)t._o=shuf(t.opts.slice());
    t._o.forEach((o,k)=>{let c="";if(done){if(o===t.ans)c="ok";else if(k===run.pick)c="no"}h+=`<button class="opt ${c}" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`})}
  if(t.ty==="gap"){if(!t._o)t._o=shuf(t.opts.slice());
    const fill=done?`<span class="blank ${run.res?"okb":"nob"}">${esc(t._o[run.pick])}</span>`:`<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
    h+=`<p class="en">${esc(t.before)} ${fill} ${esc(t.after)}</p><div class="pool">${t._o.map((o,k)=>`<button class="w gp" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`).join("")}</div>`}
  if(t.ty==="build"){if(!run.pool){run.pool=shuf(t.ans.split(" ").map((w,k)=>({w,k})));run.sel=[]}
    h+=`<div class="slot" id="slot">${run.sel.map((p,j)=>`<button class="w" data-j="${j}" ${done?"disabled":""}>${esc(p.w)}</button>`).join("")||'<span style="color:var(--mut);padding:8px">Нажимайте на слова по порядку</span>'}</div>
    <div class="pool">${run.pool.filter(p=>!run.sel.includes(p)).map(p=>`<button class="w" data-k="${p.k}">${esc(p.w)}</button>`).join("")}</div>
    ${done?"":`<button class="btn" id="chk" ${run.sel.length?"":"disabled"}>Проверить</button>`}`}
  if(t.ty==="error"){h+=`<p class="units" style="margin:-6px 0 10px">Нажмите на слово с ошибкой</p><p class="en">${t.words.map((w,k)=>{let c="";if(done){if(t.bad.includes(k))c="errw";else if(k===run.pick)c="nob"}return `<button class="ew ${c}" data-k="${k}" ${done?"disabled":""}>${esc(w)}</button>`}).join(" ")}</p>`}
  if(t.ty==="type"){h+=`<input id="inp" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${AI?"Пиши своими словами — проверит ИИ":"Напишите перевод"}" value="${esc(run.typed||"")}" ${done?"disabled":""}>${done?"":`<button class="btn" id="chk">Проверить</button>`}`}
  if(t.ty==="match"){if(!run.m){run.m={ru:shuf(t.pairs.map((p,k)=>k)),en:shuf(t.pairs.map((p,k)=>k)),sel:null,ok:new Set(),err:0,flash:null}}const m=run.m;
    h+=`<p class="units" style="margin:6px 0 10px">Нажмите русскую фразу, затем её перевод</p><div class="mt"><div>${m.ru.map(k=>`<button class="mc ${m.ok.has(k)?"okm":""} ${m.sel===k?"sel":""}" data-r="${k}" ${m.ok.has(k)||done?"disabled":""}>${esc(t.pairs[k][0])}</button>`).join("")}</div>
    <div>${m.en.map(k=>`<button class="mc ${m.ok.has(k)?"okm":""} ${m.flash===k?"nom":""}" data-e="${k}" ${m.ok.has(k)||done?"disabled":""}>${esc(t.pairs[k][1])}</button>`).join("")}</div></div>`}
  h+=feedback(t);app.innerHTML=h+`</div>`;
  bk.onclick=()=>{run=null;render()};hp.onclick=()=>sheet(t.t);
  const g=id=>document.getElementById(id);if(g("why"))g("why").onclick=()=>sheet(t.t);
  if(g("nx"))g("nx").onclick=next;
  if(g("aix"))g("aix").onclick=()=>{g("aix").remove();aiExplain(t,g("aio"))};
  if(done||run.checking)return;
  if(t.ty==="choice")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{run.pick=+b.dataset.k;run.given=t._o[run.pick];answer(t._o[run.pick]===t.ans)});
  if(t.ty==="gap")app.querySelectorAll(".gp").forEach(b=>b.onclick=()=>{run.pick=+b.dataset.k;run.given=(t.before+" "+t._o[run.pick]+" "+t.after).trim();answer(t._o[run.pick]===t.ans)});
  if(t.ty==="build"){app.querySelectorAll(".pool .w").forEach(b=>b.onclick=()=>{run.sel.push(run.pool.find(p=>p.k==b.dataset.k));render()});
    app.querySelectorAll("#slot .w").forEach(b=>b.onclick=()=>{run.sel.splice(+b.dataset.j,1);render()});
    if(g("chk"))g("chk").onclick=()=>{run.given=run.sel.map(p=>p.w).join(" ");answer(run.given===t.ans)}}
  if(t.ty==="error")app.querySelectorAll(".ew").forEach(b=>b.onclick=()=>{run.pick=+b.dataset.k;run.given="считаю ошибкой слово «"+t.words[run.pick]+"» в предложении «"+t.words.join(" ")+"»";answer(t.bad.includes(run.pick))});
  if(t.ty==="type"){const i=g("inp");i.oninput=()=>run.typed=i.value;i.onkeydown=e=>{if(e.key==="Enter")g("chk").click()};
    g("chk").onclick=async()=>{run.typed=i.value;const v=i.value.trim();if(!v)return;run.given=v;
      if(norm(v)===norm(t.ans)||!AI)return answer(norm(v)===norm(t.ans));
      run.checking=true;render();let r=null;try{r=await aiCheck(t,v)}catch(e){r=null}
      run.checking=false;if(r){run.ai=r;answer(!!r.ok)}else answer(false)};setTimeout(()=>i.focus(),50)}
  if(t.ty==="match"){const m=run.m;
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{m.sel=+b.dataset.r;m.flash=null;render()});
    app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{if(m.sel==null)return;const k=+b.dataset.e;
      if(k===m.sel){m.ok.add(k);m.sel=null;m.flash=null;if(m.ok.size===t.pairs.length){answer(m.err===0);return}}else{m.err++;m.flash=k}render()})}}

function norm(s){s=" "+s.toLowerCase().replace(/[’‘`]/g,"'")+" ";
  s=s.replace(/can't/g,"can not").replace(/cannot/g,"can not").replace(/won't/g,"will not").replace(/n't/g," not")
   .replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
   .replace(/[.,!?;:—–"«»()]/g," ").replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|forty)\b/g,w=>({one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,twenty:20,forty:40})[w]).replace(/-/g," ").replace(/'/g,"").replace(/\s+/g," ");return s.trim()}

function answer(ok){const t=run.q[run.i];run.res=ok;const s=stat(t.t);s.last=Date.now();
  if(!t.retry){if(ok){run.ok++;s.ok++}else{s.bad++;if(run.diag)run.miss.push(t.t)}}else if(ok)s.ok++;
  save();render()}
function next(){const t=run.q[run.i];delete t._o;if(!run.res&&!run.diag&&!t.retry)run.q.push(Object.assign({},t,{retry:true}));
  run.i++;run.res=null;run.pick=null;run.ai=null;run.given="";run.checking=false;run.pool=null;run.sel=null;run.typed="";run.m=null;render()}

function finish(){const pct=Math.round(run.ok/run.first*100);let h=`<div class="card">`;
  if(run.diag){const weak=[...new Set(run.miss)];
    h+=`<div class="scheme">Результат диагностики</div><div class="big">${run.ok} / ${run.first}</div><p style="color:var(--mut)">${weak.length?"Темы, которые стоит пройти:":"Ошибок нет — можно открыть все уроки и заниматься «Умным миксом»."}</p><div class="list">`;
    weak.forEach(t=>h+=`<button class="item" data-t="${t}"><div><b>${esc(PATH[t].n)}</b><small>Уровень ${TOPIC_LV[t]+1} · юниты ${PATH[t].u}</small></div><span class="pill r">?</span></button>`);
    h+=`</div><div class="row" style="margin-top:14px"><button class="btn" id="mark">Отметить остальные темы пройденными</button><button class="btn ghost" id="all">В «Путь»</button></div>`;
    app.innerHTML=h+`</div>`;app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>sheet(+b.dataset.t));
    mark.onclick=()=>{LESSONS.forEach((L,i)=>{if(L.kind==="topic"&&!weak.includes(L.t))st.les[i]={best:100,pass:true}});save();setMode("path")};
    all.onclick=()=>setMode("path");return}
  if(run.lesson!=null){const i=run.lesson,pass=pct>=80,prev=st.les[i]||{best:0,pass:false};st.les[i]={best:Math.max(prev.best,pct),pass:prev.pass||pass};save();
    h+=`<div class="scheme">${LESSONS[i].kind==="topic"?esc(PATH[LESSONS[i].t].n):"Контрольный микс"}</div><div class="big">${pct}%</div>
    <p>${run.ok} из ${run.first} с первого раза. ${pass?(i+1<LESSONS.length?"Следующий урок открыт.":"Весь путь пройден!"):"Нужно 80%, чтобы идти дальше. Ошибки уже повторены в конце, попробуйте ещё раз."}</p>
    <div class="row">${pass&&i+1<LESSONS.length?`<button class="btn" id="nxt">Следующий урок →</button>`:`<button class="btn" id="again">Ещё раз</button>`}<button class="btn ghost" id="all">Все уроки</button></div>`}
  else h+=`<div class="scheme">Умный микс</div><div class="big">${pct}%</div><p>${run.ok} из ${run.first} с первого раза. Слабые темы попадутся чаще в следующем миксе.</p><div class="row"><button class="btn" id="again">Новый микс</button></div>`;
  app.innerHTML=h+`</div>`;const g=id=>document.getElementById(id);
  if(g("again"))g("again").onclick=()=>{const L=run.lesson;run=null;if(L!=null){view=L;render();g("go").click()}else{render();g("go").click()}};
  if(g("all"))g("all").onclick=()=>{run=null;view=null;render()};
  if(g("nxt"))g("nxt").onclick=()=>{const n=run.lesson+1;run=null;view=n;render()}}

function avatar(tu,cls){const h=tu.hair,s=tu.skin;
  const back=tu.style==="bob"?`<path d="M45 95 Q45 30 100 28 Q155 30 155 95 L155 140 Q130 150 100 150 Q70 150 45 140Z" fill="${h}"/>`:tu.style==="long"?`<path d="M42 95 Q42 28 100 26 Q158 28 158 95 L166 178 Q100 192 34 178Z" fill="${h}"/>`:"";
  const front=tu.style==="bob"?`<path d="M55 82 Q58 35 100 35 Q142 35 145 82 Q125 62 100 64 Q75 62 55 82Z" fill="${h}"/>`:tu.style==="long"?`<path d="M55 88 Q58 34 100 34 Q142 34 145 88 Q120 50 95 58 Q72 64 55 88Z" fill="${h}"/>`:`<path d="M55 86 Q52 38 100 36 Q148 38 145 86 Q138 58 100 56 Q66 58 55 86Z" fill="${h}"/>`;
  const eye=x=>`<g class="eye"><ellipse cx="${x}" cy="98" rx="7" ry="8" fill="#fff"/><circle cx="${x}" cy="99" r="4.5" fill="#3b2a20"/><circle cx="${x+1.5}" cy="97.5" r="1.4" fill="#fff"/></g>`;
  return `<svg class="av ${cls||""}" viewBox="0 0 200 220" aria-label="${tu.n}">${back}
  <path d="M30 220 Q30 165 100 160 Q170 165 170 220Z" fill="${tu.shirt}"/><rect x="85" y="128" width="30" height="38" rx="10" fill="${s}"/>
  <circle cx="55" cy="100" r="10" fill="${s}"/><circle cx="145" cy="100" r="10" fill="${s}"/><ellipse cx="100" cy="95" rx="45" ry="52" fill="${s}"/>${front}
  ${eye(82)}${eye(118)}<path d="M73 84 Q82 79 91 84" stroke="${h}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M109 84 Q118 79 127 84" stroke="${h}" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M100 103 Q97 113 101 115" stroke="rgba(0,0,0,.25)" stroke-width="2" fill="none"/><circle cx="74" cy="116" r="7" fill="#f08a8a" opacity=".35"/><circle cx="126" cy="116" r="7" fill="#f08a8a" opacity=".35"/>
  <g class="mouth"><path d="M88 124 Q100 135 112 124 Q100 128 88 124Z" fill="#b5474a"/></g></svg>`}
function setSpeaking(on){document.querySelectorAll(".avwrap").forEach(e=>e.classList.toggle("speaking",on))}

function say(text,force){if(!voiceOn&&!force)return Promise.resolve();
  if(TTS)return TTS.speak(text,{language:"en",voice:tutor.voice}).catch(()=>{});
  return new Promise(res=>{try{if(!window.speechSynthesis){fake();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=tutor.lang;u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang===tutor.lang)||speechSynthesis.getVoices().find(v=>v.lang.startsWith("en"));if(v)u.voice=v;
    u.onstart=()=>setSpeaking(true);u.onend=u.onerror=()=>{setSpeaking(false);res()};speechSynthesis.speak(u)}catch(e){fake()}
    function fake(){setSpeaking(true);setTimeout(()=>{setSpeaking(false);res()},Math.min(6000,text.length*55))}})}

/* ---- распознавание речи: одна обёртка для Claude и браузера ---- */
let rec=null;
function listen(onText,onDone){let base="";
  if(D){D.onPartial(({text})=>onText((base+" "+text).trim()));D.onFinal(({text})=>{base=(base+" "+text).trim();onText(base)});
    D.onState(({state})=>{if(state==="idle")onDone(base)});
    return D.start().then(()=>true).catch(e=>{onDone(null,e&&e.code)})}
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;let txt="";
  rec.onresult=ev=>{txt="";for(const r of ev.results)txt+=r[0].transcript;onText(txt)};
  rec.onend=()=>onDone(txt);rec.onerror=()=>{};try{rec.start()}catch(e){onDone(null)}return Promise.resolve(true)}
function stopListen(){if(D)return D.stop().catch(()=>{});if(rec)rec.stop();return Promise.resolve()}

/* ---- ИИ ---- */
function talkPrompt(learner){const sc=talk.sc,story=talk.ep!=null?EPIS[talk.ep]:null;
  const topics=PATH.map((p,i)=>i+": "+p.n).join("\n");
  const hist=talk.msgs.slice(-14).map(m=>(m.who==="ai"?"Partner: ":"Learner: ")+m.text).join("\n");
  const who=story?`This is an interactive story: the learner is the hero visiting London. Scene: ${story.set}
The learner must reach these goals by speaking:\n${story.goals.map((g,i)=>"g"+i+": "+g[1]).join("\n")}
Stay in character, react to what the learner says and move the story forward. Do not list the goals. When all goals are reached, end the scene naturally in 1-2 sentences and set "complete": true.`
   :`You are ${tutor.en}, who ${tutor.about}. You are on a video call with the learner. Topic: ${sc.en}.`;
  return `You are a friendly English speaking partner for a Russian-speaking learner (level A2-B1).
${who}
Gently steer the talk so the learner needs these structures: ${sc.f.map(i=>PATH[i].n).join("; ")}.

Rules for "reply": spoken style, 1-3 short sentences of simple natural English (A2-B1 words), ${story?"stay in the scene":"end with ONE question that invites a full-sentence answer"}. Never explain grammar inside "reply". If the learner writes in Russian or seems stuck, answer simply and make the next step easier.
${learner==null?'This is the start: greet the learner and open the conversation or scene. "correction" must be null.':`Check ONLY the learner's last message (it may come from speech recognition): if it has a grammar or word-choice mistake a teacher would fix, fill "correction"; ignore punctuation, capital letters, fillers and small recognition glitches. If it is fine, "correction" is null.`}

Grammar topics (id: name):
${topics}

Conversation so far:
${hist||"(empty)"}

Reply with JSON only:
{"reply":"your next spoken line","reply_ru":"its Russian translation","correction":null or {"fixed":"the learner's last message corrected minimally","note":"one short sentence in Russian (на ты): what was wrong and the rule","topic":id of the closest grammar topic or null},"hint":"a short natural answer the learner could say next"${story?',"goals_done":["ids of ALL goals reached so far, e.g. g0"],"complete":true or false':""}}`}

async function talkTurn(learner){talk.busy=true;render();
  try{const r=await AI.json(talkPrompt(learner),{modelTier:"quick",cache:false});
    const me=learner!=null?talk.msgs[talk.msgs.length-1]:null;
    if(me&&r.correction&&r.correction.fixed&&norm(r.correction.fixed)!==norm(me.text)){me.corr=r.correction;
      if(Number.isInteger(r.correction.topic)&&PATH[r.correction.topic]){const s=stat(r.correction.topic);s.bad++;s.last=Date.now();save()}}
    else if(me)talk.good++;
    if(talk.ep!=null&&Array.isArray(r.goals_done))r.goals_done.forEach(g=>talk.goals.add(String(g)));
    if(talk.ep!=null&&r.complete&&talk.goals.size>=EPIS[talk.ep].goals.length){talk.complete=true;st.ep=st.ep||{};st.ep[talk.ep]=true;save()}
    talk.msgs.push({who:"ai",text:r.reply||"Sorry, could you say that again?",ru:r.reply_ru||"",hint:r.hint||""});
    talk.busy=false;render();say(r.reply||"")}
  catch(e){talk.busy=false;talk.err=e&&e.code==="rate_limited"?"Слишком много запросов — подождите немного.":"Собеседник не ответил. Отправьте ещё раз.";render()}}
function talkSend(v){v=(v||"").trim();if(!v||talk.busy)return;talk.err=null;talk.live="";talk.msgs.push({who:"me",text:v});talk.turns++;talkTurn(v)}

/* ---- экраны ---- */
function talkList(){const weak=weakTopics(3);st.ep=st.ep||{};
  let h=`<div class="card"><div class="scheme">Говорение с ИИ</div><p class="ru" style="font-size:22px;margin-bottom:10px">С кем поговорим?</p>
  <div class="tutors">${TUTORS.map(t=>`<button class="tut ${t.id===tutor.id?"on":""}" data-u="${t.id}"><div class="avwrap sm">${avatar(t)}</div><b>${t.n}</b><small>${t.city}</small></button>`).join("")}</div>
  ${AI?"":`<p class="why no">ИИ-собеседник пока недоступен в словаре. <a href="https://claude.ai/artifact/9ucgvRDfYcoV35jgR8ZUkV">Открыть разговорную практику в Claude</a>.</p>`}
  ${AI&&!canMic()?`<p class="units" style="margin-top:10px">Микрофон здесь недоступен — отвечайте текстом. Голосом можно в Chrome на компьютере.</p>`:""}</div>
  <div class="stage">📞 Видеозвонок — свободный разговор</div><div class="list">`;
  if(weak.length)h+=`<button class="item go" data-k="weak"><div><b>🎯 Мои слабые темы</b><small>${weak.map(t=>esc(PATH[t].n)).join(", ")}</small></div><span class="pill r">по ошибкам</span></button>`;
  SCEN.forEach(s=>h+=`<button class="item go" data-k="${s.id}"><div><b>${s.ico} ${s.n}</b><small>${s.d} · ${s.f.map(t=>esc(PATH[t].n)).join(", ")}</small></div><span class="pill">позвонить</span></button>`);
  h+=`</div><div class="stage">🎬 Сериал «Неделя в Лондоне» — вы главный герой</div><div class="list">`;
  EPIS.forEach((e,i)=>{const lk=i>0&&!st.ep[i-1]&&!st.open;h+=`<button class="item go ${lk?"lock":""}" data-e="${i}" ${lk?"disabled":""}><div><b>${e.ico} Эпизод ${i+1}. ${e.n}</b><small>${e.goals.map(g=>g[0]).join(" · ")}</small></div><span class="pill ${st.ep[i]?"g":""}">${st.ep[i]?"пройден":lk?"🔒":"играть"}</span></button>`});
  app.innerHTML=h+`</div>`;
  if(!AI) app.querySelectorAll(".go").forEach(button=>{button.disabled=true});
  app.querySelectorAll(".tut").forEach(b=>b.onclick=()=>{tutor=TUTORS.find(t=>t.id===b.dataset.u);render()});
  app.querySelectorAll(".go:not(.lock)").forEach(b=>b.onclick=()=>{if(!AI)return;const k=b.dataset.k,e=b.dataset.e;
    let sc=k==="weak"?{ico:"🎯",n:"Мои слабые темы",en:"free friendly chat about the learner's everyday life",f:weak}:k?SCEN.find(x=>x.id===k):{ico:EPIS[+e].ico,n:"Эпизод "+(+e+1)+". "+EPIS[+e].n,f:EPIS[+e].f};
    talk={sc,ep:e!=null?+e:null,goals:new Set(),msgs:[],busy:false,listening:false,live:"",ru:false,turns:0,good:0,err:null,t0:Date.now(),kbd:!canMic(),pron:[]};
    talkTurn(null)})}

function talkCall(){const t=talk,last=[...t.msgs].reverse().find(m=>m.who==="ai"),me=t.msgs[t.msgs.length-1];
  const lastMe=[...t.msgs].reverse().find(m=>m.who==="me");
  const mins=Math.floor((Date.now()-t.t0)/60000);
  let h=`<div class="call"><div class="ctop"><button class="cbtn" id="cx">✕</button><div class="cname">${t.ep!=null?esc(t.sc.n):tutor.n+" · "+tutor.city}<small>${t.ep!=null?"Сериал «Неделя в Лондоне»":esc(t.sc.ico+" "+t.sc.n)}</small></div><button class="cbtn" id="clog" title="Переписка">☰</button></div>`;
  if(t.ep!=null)h+=`<div class="goals">${EPIS[t.ep].goals.map((g,i)=>`<span class="${t.goals.has("g"+i)?"ok":""}">${t.goals.has("g"+i)?"✓":"○"} ${esc(g[0])}</span>`).join("")}</div>`;
  h+=`<div class="avwrap big">${avatar(tutor)}</div>`;
  if(t.complete)h+=`<div class="done">🎉 Эпизод пройден!<br><button class="btn" id="cend2">Итог и следующий эпизод</button></div>`;
  h+=`<div class="cap">${t.busy?`<span class="typing">${tutor.n} думает…</span>`:last?`${esc(last.text)}${t.ru&&last.ru?`<div class="tr">${esc(last.ru)}</div>`:""}`:""}</div>`;
  if(lastMe&&lastMe.corr&&me===lastMe||lastMe&&lastMe.corr&&t.msgs.indexOf(lastMe)===t.msgs.length-2&&!t.busy)
    h+=`<div class="ctoast"><b>Лучше:</b> ${esc(lastMe.corr.fixed)}<br><span>${esc(lastMe.corr.note||"")}</span><div class="row" style="gap:10px;margin-top:6px">${canMic()?`<button class="linkb" id="crep">🎯 Повторить вслух</button>`:""}${Number.isInteger(lastMe.corr.topic)&&PATH[lastMe.corr.topic]?`<button class="linkb" id="crule">Правило</button>`:""}</div></div>`;
  if(t.live)h+=`<div class="live">${esc(t.live)}</div>`;
  if(t.err)h+=`<div class="ctoast err">${esc(t.err)}</div>`;
  h+=`<div class="hintline" id="chint"></div>
  <div class="ctrl"><button class="cbtn ${t.ru?"on":""}" id="cru">RU</button><button class="cbtn" id="chb" title="Подсказка">💡</button>
  ${canMic()&&!t.kbd?`<button class="micbig ${t.listening?"rec":""}" id="cmic" ${t.busy?"disabled":""}>${t.listening?"■":"🎤"}</button>`:""}
  <button class="cbtn ${voiceOn?"on":""}" id="cvo">🔊</button><button class="cbtn ${t.kbd?"on":""}" id="ckb" title="Клавиатура">⌨️</button></div>
  ${t.kbd?`<div class="inrow"><textarea id="tin" rows="2" placeholder="Ответьте по-английски"></textarea><button class="btn" id="tsend" ${t.busy?"disabled":""}>→</button></div>`:`<p class="clbl">${t.listening?"Слушаю… нажмите ■, когда закончите":t.busy?"":"Нажмите 🎤 и ответьте вслух"}</p>`}
  <button class="cend" id="cend">Завершить звонок · ${t.turns} реплик${mins?` · ${mins} мин`:""}</button></div>`;
  app.innerHTML=h;const g=id=>document.getElementById(id);
  g("cx").onclick=g("cend").onclick=()=>{stopListen();try{TTS&&TTS.stop();speechSynthesis&&speechSynthesis.cancel()}catch(e){}t.done=true;render()};
  if(g("cend2"))g("cend2").onclick=()=>{t.done=true;render()};
  g("clog").onclick=()=>logSheet();g("cru").onclick=()=>{t.ru=!t.ru;render()};
  g("cvo").onclick=()=>{voiceOn=!voiceOn;if(!voiceOn){try{TTS&&TTS.stop();speechSynthesis&&speechSynthesis.cancel()}catch(e){}}render()};
  g("ckb").onclick=()=>{t.kbd=!t.kbd;render()};
  g("chb").onclick=()=>{g("chint").textContent=last&&last.hint?"Можно сказать: "+last.hint:"Подсказка появится после реплики собеседника"};
  if(g("crule"))g("crule").onclick=()=>sheet(lastMe.corr.topic);
  if(g("crep"))g("crep").onclick=()=>pronounce(lastMe.corr.fixed);
  if(g("tin")){g("tin").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();talkSend(e.target.value)}};g("tsend").onclick=()=>talkSend(g("tin").value);if(!t.busy)g("tin").focus()}
  if(g("cmic"))g("cmic").onclick=()=>{
    if(t.listening){t.listening=false;stopListen();render();return}
    try{TTS&&TTS.stop();speechSynthesis&&speechSynthesis.cancel()}catch(e){}
    t.listening=true;t.live="";t.err=null;
    listen(x=>{t.live=x;const l=document.querySelector(".live");if(l)l.textContent=x;else render()},
      (txt,code)=>{t.listening=false;if(code){t.err=code==="not_granted"?"Микрофон не разрешён — переключитесь на ⌨️.":"Не удалось включить микрофон.";render();return}
        if(txt&&txt.trim())talkSend(txt);else{t.live="";render()}});
    render()}}

function logSheet(){const d=document.createElement("div");d.className="ov";
  d.innerHTML=`<div class="sh"><div class="grab"></div><div class="scheme">Переписка</div><div class="msgs">${talk.msgs.map(m=>m.who==="ai"?`<div class="b ai">${esc(m.text)}${m.ru?`<div class="tr">${esc(m.ru)}</div>`:""}</div>`:`<div class="b me">${esc(m.text)}</div>${m.corr?`<div class="corr"><b>Лучше:</b> ${esc(m.corr.fixed)}<br><span>${esc(m.corr.note||"")}</span></div>`:""}`).join("")}</div><button class="btn" style="width:100%;margin-top:12px" id="lx">Закрыть</button></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector("#lx").onclick=()=>d.remove()}

/* ---- произношение: повтори за мной ---- */
function words(s){return norm(s).split(" ").filter(Boolean)}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
function score(target,said){const T=words(target),S=words(said),eq=(a,b)=>a===b||(a.length>3&&lev(a,b)<=1);
  const L=Array(T.length+1).fill(0).map(()=>Array(S.length+1).fill(0));
  for(let i=1;i<=T.length;i++)for(let j=1;j<=S.length;j++)L[i][j]=eq(T[i-1],S[j-1])?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
  const hit=new Set();let i=T.length,j=S.length;while(i&&j){if(eq(T[i-1],S[j-1])){hit.add(i-1);i--;j--}else if(L[i-1][j]>=L[i][j-1])i--;else j--}
  return{pct:T.length?Math.round(hit.size/T.length*100):0,T,hit}}
function pronounce(target){const d=document.createElement("div");d.className="ov";let busy=false;
  const draw=(res,said)=>{d.innerHTML=`<div class="sh"><div class="grab"></div><div class="scheme">Повтори за собеседником</div>
    <p class="ru" style="font-size:22px">${res?res.T.map((w,k)=>`<span class="${res.hit.has(k)?"pw ok":"pw no"}">${esc(w)}</span>`).join(" "):esc(target)}</p>
    ${res?`<div class="pring" style="--p:${res.pct}"><span>${res.pct}%</span></div><p style="text-align:center">${res.pct>=90?"Отлично, очень чисто!":res.pct>=70?"Хорошо! Красные слова — попробуй ещё раз.":"Попробуй медленнее и чётче."}</p><p class="units" style="text-align:center">Услышано: «${esc(said||"…")}»</p>`:`<p class="units">Нажми 🔊, послушай, потом нажми 🎤 и повтори фразу.</p>`}
    <div class="row" style="justify-content:center;gap:12px;margin:12px 0"><button class="cbtn dark" id="pl">🔊</button><button class="micbig" id="pm">${busy?"■":"🎤"}</button></div>
    <p class="units" style="text-align:center">Оценка по распознанным словам: показывает, какие слова звучат неразборчиво.</p>
    <button class="btn ghost" style="width:100%" id="px">Готово</button></div>`;
    d.querySelector("#pl").onclick=()=>say(target,true);
    d.querySelector("#px").onclick=()=>{stopListen();d.remove()};
    d.querySelector("#pm").onclick=()=>{if(busy){stopListen();return}busy=true;let heard="";draw(null);
      listen(x=>{heard=x},(txt)=>{busy=false;const r=score(target,txt||heard||"");if(talk)talk.pron.push(r.pct);draw(r,txt||heard)})}};
  draw(null);document.body.appendChild(d)}

function talkSummary(){const t=talk;const cs=t.msgs.filter(m=>m.corr);const by={};
  cs.forEach(m=>{const k=Number.isInteger(m.corr.topic)&&PATH[m.corr.topic]?m.corr.topic:-1;(by[k]=by[k]||[]).push(m)});
  const pr=t.pron.length?Math.round(t.pron.reduce((a,b)=>a+b,0)/t.pron.length):null;
  const nx=t.ep!=null&&t.complete&&t.ep+1<EPIS.length?t.ep+1:null;
  let h=`<div class="card"><div class="scheme">Итог · ${esc(t.sc.n)}</div>
  <div class="stats"><div><b>${t.turns}</b><small>реплик</small></div><div><b>${t.turns?Math.round(t.good/t.turns*100):0}%</b><small>без ошибок</small></div>${pr!=null?`<div><b>${pr}%</b><small>произношение</small></div>`:""}${t.ep!=null?`<div><b>${t.goals.size}/${EPIS[t.ep].goals.length}</b><small>цели эпизода</small></div>`:""}</div>
  <p>${cs.length?"Что стоит подтянуть:":t.turns?"Ни одной поправки — отлично!":"Вы ещё ничего не сказали."}</p><div class="list">`;
  Object.entries(by).forEach(([k,arr])=>{k=+k;h+=`<div class="item" style="display:block;cursor:default"><b>${k>=0?esc(PATH[k].n):"Слова и выражения"}</b>
    ${arr.map(m=>`<small><s>${esc(m.text)}</s><br>✓ ${esc(m.corr.fixed)}</small>`).join("")}
    <div class="row" style="margin-top:8px;gap:10px">${k>=0?`<button class="btn ghost tl" data-t="${k}">Урок по теме</button><button class="linkb" data-r="${k}">Правило</button>`:""}${canMic()?`<button class="linkb pr" data-f="${esc(arr[0].corr.fixed)}">🎯 Произнести</button>`:""}</div></div>`});
  h+=`</div><div class="row" style="margin-top:14px">${nx!=null?`<button class="btn" id="tnext">Эпизод ${nx+1} →</button>`:`<button class="btn" id="tagain">Ещё разговор</button>`}${t.complete?"":`<button class="btn ghost" id="tback">Вернуться в звонок</button>`}</div></div>`;
  app.innerHTML=h;const g=id=>document.getElementById(id);
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>sheet(+b.dataset.r));
  app.querySelectorAll(".pr").forEach(b=>b.onclick=()=>pronounce(b.dataset.f));
  app.querySelectorAll(".tl").forEach(b=>b.onclick=()=>{const i=LESSONS.findIndex(l=>l.t===+b.dataset.t);talk=null;st.open=true;save();setMode("path");view=i;render()});
  if(g("tagain"))g("tagain").onclick=()=>{talk=null;render()};
  if(g("tback"))g("tback").onclick=()=>{t.done=false;render()};
  if(g("tnext"))g("tnext").onclick=()=>{talk=null;render();const b=document.querySelector(`[data-e="${nx}"]`);if(b)b.click()}}

render();
</script>
